version: 2
updates:
  - package-ecosystem: npm
    directory: /installer-kit
    target-branch: preproduction
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types: ["minor", "patch"]
    ignore:
      # Keep @types/node on the Node.js major the templates run on (22).
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: npm
    directory: /forecourt-checkout
    target-branch: preproduction
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types: ["minor", "patch"]
    ignore:
      # Keep @types/node on the Node.js major the templates run on (22).
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: npm
    directory: /fleet-depot
    target-branch: preproduction
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types: ["minor", "patch"]
    ignore:
      # Keep @types/node on the Node.js major the templates run on (22).
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: npm
    directory: /cpo-starter-kit
    target-branch: preproduction
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types: ["minor", "patch"]
    ignore:
      # Keep @types/node on the Node.js major the templates run on (22).
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: npm
    directory: /emsp-starter/server
    target-branch: preproduction
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types: ["minor", "patch"]
    ignore:
      # Keep @types/node on the Node.js major the templates run on (22).
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: npm
    directory: /emsp-starter/app
    target-branch: preproduction
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types: ["minor", "patch"]
    ignore:
      # Keep @types/node on the major the app's own package.json uses.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
      # Expo pins expo, expo-*, @expo/*, react, react-dom and react-native
      # to the SDK version. Those bumps come with an Expo SDK upgrade done by
      # hand (`npx expo install --fix`), not by Dependabot. react-native is
      # 0.x, so its SDK-breaking bumps are semver-minor and are ignored too.
      - dependency-name: "expo"
        update-types: ["version-update:semver-major"]
      - dependency-name: "expo-*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@expo/*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "react"
        update-types: ["version-update:semver-major"]
      - dependency-name: "react-dom"
        update-types: ["version-update:semver-major"]
      - dependency-name: "react-native"
        update-types:
          ["version-update:semver-major", "version-update:semver-minor"]

  - package-ecosystem: npm
    directory: /tools/check-migrations
    target-branch: preproduction
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types: ["minor", "patch"]
    ignore:
      # Keep @types/node on the Node.js major the templates run on (22).
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: /
    target-branch: preproduction
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
