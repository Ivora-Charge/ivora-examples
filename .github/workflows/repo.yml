name: repo

on:
  pull_request:
    paths:
      - "*.md"
      - "docs/**"
      - ".github/**"
      - ".editorconfig"
      - ".gitignore"
  push:
    branches: [main, preproduction]
    paths:
      - "*.md"
      - "docs/**"
      - ".github/**"
      - ".editorconfig"
      - ".gitignore"

permissions:
  contents: read

jobs:
  root-files:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - name: Prettier (root files)
        run: npx --yes prettier@3.6.2 --check "*.md" "docs/**/*.md" ".github/**/*.md" ".github/*.yml" ".github/ISSUE_TEMPLATE/*.yml" ".github/workflows/repo.yml" ".github/scripts/*.mjs"
      - name: Relative links
        run: node .github/scripts/check-relative-links.mjs
