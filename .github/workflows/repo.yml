name: repo

on:
  pull_request:
    paths:
      - "*.md"
      - "docs/**"
      - ".github/**"
      - ".editorconfig"
      - ".gitignore"
  push:
    branches: [main, preproduction]
    paths:
      - "*.md"
      - "docs/**"
      - ".github/**"
      - ".editorconfig"
      - ".gitignore"

permissions:
  contents: read

jobs:
  root-files:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: Prettier (root files)
        run: npx --yes prettier@3.6.2 --check "*.md" "docs/**/*.md" ".github/**/*.md" ".github/*.yml" ".github/ISSUE_TEMPLATE/*.yml" ".github/workflows/repo.yml" ".github/scripts/*.mjs"
      - name: Relative links
        run: node .github/scripts/check-relative-links.mjs
