name: cpo-starter-kit

on:
  pull_request:
    paths:
      - "cpo-starter-kit/**"
      - ".github/workflows/cpo-starter-kit.yml"
  push:
    branches: [main, preproduction]
    paths:
      - "cpo-starter-kit/**"
      - ".github/workflows/cpo-starter-kit.yml"

permissions:
  contents: read

# One run per workflow and PR: a new push to a PR cancels its older run.
# Pushes to branches (preproduction, main) are never cancelled, so every
# merge commit is verified.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: cpo-starter-kit
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: cpo-starter-kit/package-lock.json
      - run: npm ci
      - run: npm run format:check
      - run: npm run typecheck
      # The 10-30 rule: RLS on every public table, no default or unbacked grants.
      - run: npm run check:migrations
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
