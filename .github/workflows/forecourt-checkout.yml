name: forecourt-checkout

# Called from ci.yml, which decides when it runs. Can also be run by hand.
on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: forecourt-checkout
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: forecourt-checkout/package-lock.json
      - run: npm ci
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Demo end to end (offline, no credentials)
        run: |
          npx playwright install --with-deps chromium
          npm run test:e2e
