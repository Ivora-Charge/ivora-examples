name: forecourt-checkout

on:
  pull_request:
    paths:
      - "forecourt-checkout/**"
      - ".github/workflows/forecourt-checkout.yml"
  push:
    branches: [main, preproduction]
    paths:
      - "forecourt-checkout/**"
      - ".github/workflows/forecourt-checkout.yml"

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: forecourt-checkout
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: forecourt-checkout/package-lock.json
      - run: npm ci
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Demo end to end (offline, no credentials)
        run: |
          npx playwright install --with-deps chromium
          npm run test:e2e
