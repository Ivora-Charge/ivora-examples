name: forecourt-checkout

on:
  pull_request:
    paths:
      - "forecourt-checkout/**"
      - ".github/workflows/forecourt-checkout.yml"
  push:
    branches: [main, preproduction]
    paths:
      - "forecourt-checkout/**"
      - ".github/workflows/forecourt-checkout.yml"

permissions:
  contents: read

# One run per workflow and PR: a new push to a PR cancels its older run.
# Pushes to branches (preproduction, main) are never cancelled, so every
# merge commit is verified.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: forecourt-checkout
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: forecourt-checkout/package-lock.json
      - run: npm ci
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Demo end to end (offline, no credentials)
        run: |
          npx playwright install --with-deps chromium
          npm run test:e2e
