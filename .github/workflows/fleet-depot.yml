name: fleet-depot
on:
  push:
    paths: ["fleet-depot/**", ".github/workflows/fleet-depot.yml"]
  pull_request:
    paths: ["fleet-depot/**", ".github/workflows/fleet-depot.yml"]
defaults:
  run:
    working-directory: fleet-depot
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: fleet-depot/package-lock.json
      - run: npm ci
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
