name: emsp-starter

on:
  pull_request:
    paths:
      - "emsp-starter/**"
      - "tools/check-migrations/**"
      - ".github/workflows/emsp-starter.yml"
  push:
    branches: [main, preproduction]
    paths:
      - "emsp-starter/**"
      - "tools/check-migrations/**"
      - ".github/workflows/emsp-starter.yml"

permissions:
  contents: read

# One run per workflow and PR: a new push to a PR cancels its older run.
# Pushes to branches (preproduction, main) are never cancelled, so every
# merge commit is verified.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  server:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: emsp-starter/server
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: emsp-starter/server/package-lock.json
      - run: npm ci
      - run: npm run format:check
      - run: npm run typecheck
      # The 10-30 rule, with the shared checker in tools/check-migrations.
      - run: npm run check:migrations
      # Unit tests include the PGlite migration tests and the brand-token sync check.
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e

  app:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: emsp-starter/app
    env:
      EXPO_NO_TELEMETRY: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: emsp-starter/app/package-lock.json
      - run: npm ci
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm test
      # Web build only (expo export). No native store builds in CI.
      - name: Build (web)
        run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
