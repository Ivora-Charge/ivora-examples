name: emsp-starter

on:
  pull_request:
    paths:
      - "emsp-starter/**"
      - ".github/workflows/emsp-starter.yml"
  push:
    branches: [main, preproduction]
    paths:
      - "emsp-starter/**"
      - ".github/workflows/emsp-starter.yml"

permissions:
  contents: read

jobs:
  server:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: emsp-starter/server
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: emsp-starter/server/package-lock.json
      - run: npm ci
      - run: npm run format:check
      - run: npm run typecheck
      - name: Migrations follow the 10-30 rule
        run: npm run check:migrations
      # Unit tests include the PGlite migration tests and the brand-token sync check.
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e

  app:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: emsp-starter/app
    env:
      EXPO_NO_TELEMETRY: "1"
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: emsp-starter/app/package-lock.json
      - run: npm ci
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm test
      # Web build only (expo export). No native store builds in CI.
      - name: Build (web)
        run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
