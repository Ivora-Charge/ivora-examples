name: tools

# Called from ci.yml, which decides when it runs. Can also be run by hand.
on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check-migrations:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: tools/check-migrations
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: tools/check-migrations/package-lock.json
      - run: npm ci
      - run: npm run format:check
      # Unit tests for every rule, plus the PGlite proof with Supabase's default privileges.
      - run: npm test
